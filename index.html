<style>
:root{--bg:#0a0705;--panel:#110b07;--gold:#C9A84C;--gold-lt:#E8CB7A;--gold-dim:#8B6914;--cream:#FAF0E0;--mink:#C4B0A8;--border:rgba(201,168,76,0.15);--active:rgba(201,168,76,0.1);}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100vh;overflow:hidden;background:var(--bg);color:var(--cream);font-family:'Jost',sans-serif;}
.game{display:grid;grid-template-columns:220px 1fr 220px;height:100vh;}
.panel{background:var(--panel);display:flex;flex-direction:column;overflow:hidden;}
.panel-left{border-right:1px solid var(--border);}
.panel-right{border-left:1px solid var(--border);}
.panel-title{padding:14px 14px 10px;font-size:0.48rem;letter-spacing:0.35em;text-transform:uppercase;color:var(--gold-dim);border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:6px;}
.panel-title::before{content:'✦';color:var(--gold);}
.panel-scroll{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px;}
.slot{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;border:1.5px solid rgba(201,168,76,0.15);transition:all 0.18s;background:rgba(255,255,255,0.015);cursor:pointer;width:100%;font-family:'Jost',sans-serif;text-align:left;}
.slot:hover{border-color:rgba(201,168,76,0.3);background:var(--active);}
.slot.on{border-color:var(--gold);background:var(--active);}
.slot.dim{opacity:0.3;cursor:default;pointer-events:none;}
.slot-icon{width:48px;height:48px;border-radius:50%;overflow:hidden;flex-shrink:0;border:1.5px solid rgba(201,168,76,0.2);display:flex;align-items:center;justify-content:center;background:#1a0e06;font-size:1rem;transition:border-color 0.18s;}
.slot.on .slot-icon{border-color:var(--gold);}
.slot-icon img{width:100%;height:100%;object-fit:cover;object-position:center 8%;}
.slot-info{flex:1;}
.slot-name{font-family:'Cormorant Garamond',serif;font-size:0.9rem;font-style:italic;color:var(--cream);}
.slot.on .slot-name{color:var(--gold-lt);}
.slot-sub{font-size:0.42rem;letter-spacing:0.1em;color:var(--mink);margin-top:2px;}
.slot-dot{width:8px;height:8px;border-radius:50%;border:1.5px solid rgba(201,168,76,0.25);flex-shrink:0;transition:all 0.18s;}
.slot.on .slot-dot{background:var(--gold);border-color:var(--gold);}
.section-div{font-size:0.44rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--gold-dim);padding:10px 10px 4px;border-top:1px solid var(--border);margin-top:4px;}
.scene-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;border:1.5px solid transparent;transition:all 0.18s;background:rgba(255,255,255,0.015);width:100%;font-family:'Jost',sans-serif;}
.scene-item:hover{background:var(--active);border-color:rgba(201,168,76,0.2);}
.scene-item.on{background:var(--active);border-color:var(--gold);}
.scene-swatch{width:28px;height:28px;border-radius:6px;flex-shrink:0;}
.scene-name{font-family:'Cormorant Garamond',serif;font-size:0.85rem;font-style:italic;color:var(--cream);flex:1;text-align:left;}
.scene-item.on .scene-name{color:var(--gold-lt);}
.scene-dot{width:8px;height:8px;border-radius:50%;border:1.5px solid rgba(201,168,76,0.25);flex-shrink:0;transition:all 0.18s;}
.scene-item.on .scene-dot{background:var(--gold);border-color:var(--gold);}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px;}
.top-bar{width:100%;max-width:380px;display:flex;align-items:center;justify-content:space-between;}
.logo{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:300;font-style:italic;letter-spacing:0.08em;}
.logo b{color:var(--gold);font-weight:300;}
.btn{font-size:0.48rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--mink);background:none;border:1px solid var(--border);padding:6px 14px;cursor:pointer;font-family:'Jost',sans-serif;transition:all 0.2s;border-radius:4px;}
.btn:hover{border-color:var(--gold);color:var(--gold-lt);}
.stage-wrap{position:relative;}
.stage{display:block;border-radius:18px;box-shadow:0 0 0 1px var(--border),0 24px 80px rgba(0,0,0,0.9);}
.stage-wrap::before,.stage-wrap::after{content:'';position:absolute;width:22px;height:22px;z-index:10;pointer-events:none;}
.stage-wrap::before{top:12px;left:12px;border-top:1px solid var(--gold);border-left:1px solid var(--gold);}
.stage-wrap::after{bottom:12px;right:12px;border-bottom:1px solid var(--gold);border-right:1px solid var(--gold);}
.badge{font-size:0.5rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold-dim);text-align:center;}
.cat-bar{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;}
.cat-btn{flex:1;padding:12px 2px;font-size:0.44rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--mink);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:'Jost',sans-serif;transition:all 0.18s;}
.cat-btn.on{color:var(--gold-lt);border-bottom-color:var(--gold);background:rgba(201,168,76,0.05);}
.o-scroll{flex:1;overflow-y:auto;padding:10px;}
.o-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.o-grid.off{display:none;}
.o-card{cursor:pointer;border-radius:10px;border:2px solid transparent;overflow:hidden;background:#080503;transition:all 0.18s;position:relative;}
.o-card:hover{border-color:rgba(201,168,76,0.35);transform:translateY(-2px);}
.o-card.on{border-color:var(--gold);box-shadow:0 0 14px rgba(201,168,76,0.25);}
.o-card img{width:100%;aspect-ratio:2/3;object-fit:cover;object-position:center 8%;display:block;}
.o-lbl{padding:5px 6px;font-size:0.42rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--mink);text-align:center;background:rgba(5,3,1,0.95);}
.o-card.on .o-lbl{color:var(--gold-lt);}
.o-tick{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:50%;background:var(--gold);display:none;align-items:center;justify-content:center;font-size:0.6rem;color:#0a0705;}
.o-card.on .o-tick{display:flex;}
.none-o{cursor:pointer;border-radius:10px;border:2px dashed rgba(201,168,76,0.18);aspect-ratio:2/3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--gold-dim);font-size:0.48rem;letter-spacing:0.12em;text-transform:uppercase;transition:all 0.18s;background:rgba(44,24,16,0.12);font-family:'Jost',sans-serif;}
.none-o:hover{border-color:rgba(201,168,76,0.35);}
.none-o.on{border-color:var(--gold);color:var(--gold);background:rgba(201,168,76,0.06);}
.coming-soon{border-radius:10px;border:1px dashed rgba(201,168,76,0.1);aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;font-size:0.42rem;letter-spacing:0.1em;text-transform:uppercase;color:rgba(201,168,76,0.25);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--gold);color:#0a0705;padding:10px 24px;border-radius:8px;font-size:0.6rem;letter-spacing:0.15em;text-transform:uppercase;font-weight:500;transition:transform 0.3s ease;z-index:100;pointer-events:none;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:2px;}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="game">

  <div class="panel panel-left">
    <div class="panel-title">Hair</div>
    <div class="panel-scroll">
      <button class="slot on" data-key="none" id="slot-none">
        <div class="slot-icon">✕</div>
        <div class="slot-info"><div class="slot-name">Bald Base</div><div class="slot-sub">No hair</div></div>
        <div class="slot-dot"></div>
      </button>

      <!-- Hair slots — images load from /hair/ folder in repo -->
      <button class="slot" data-key="braids" id="slot-braids">
        <div class="slot-icon" id="icon-braids">💫</div>
        <div class="slot-info"><div class="slot-name">Box Braids</div><div class="slot-sub" id="sub-braids">Loading...</div></div>
        <div class="slot-dot"></div>
      </button>
      <button class="slot" data-key="sleek" id="slot-sleek">
        <div class="slot-icon" id="icon-sleek">💇🏿</div>
        <div class="slot-info"><div class="slot-name">Sleek Straight</div><div class="slot-sub" id="sub-sleek">Loading...</div></div>
        <div class="slot-dot"></div>
      </button>
      <button class="slot dim"><div class="slot-icon">🌊</div><div class="slot-info"><div class="slot-name">Body Wave</div><div class="slot-sub">Coming soon</div></div><div class="slot-dot"></div></button>
      <button class="slot dim"><div class="slot-icon">✨</div><div class="slot-info"><div class="slot-name">Big Afro</div><div class="slot-sub">Coming soon</div></div><div class="slot-dot"></div></button>
      <button class="slot dim"><div class="slot-icon">👑</div><div class="slot-info"><div class="slot-name">Loc Updo</div><div class="slot-sub">Coming soon</div></div><div class="slot-dot"></div></button>

      <div class="section-div">Scene</div>
      <button class="scene-item on" data-scene="black"><div class="scene-swatch" style="background:#000;border:1px solid #333;"></div><div class="scene-name">Black</div><div class="scene-dot"></div></button>
      <button class="scene-item" data-scene="closet"><div class="scene-swatch" style="background:linear-gradient(135deg,#1a0e06,#3d2010);"></div><div class="scene-name">The Closet</div><div class="scene-dot"></div></button>
      <button class="scene-item" data-scene="city"><div class="scene-swatch" style="background:linear-gradient(135deg,#06060f,#1a1a3a);"></div><div class="scene-name">City Night</div><div class="scene-dot"></div></button>
      <button class="scene-item" data-scene="golden"><div class="scene-swatch" style="background:linear-gradient(135deg,#1a0800,#c4842a);"></div><div class="scene-name">Golden Hour</div><div class="scene-dot"></div></button>
      <button class="scene-item" data-scene="studio"><div class="scene-swatch" style="background:linear-gradient(135deg,#060606,#2a0606);"></div><div class="scene-name">The Studio</div><div class="scene-dot"></div></button>
    </div>
  </div>

  <div class="center">
    <div class="top-bar">
      <div class="logo">Her <b>Closet</b></div>
      <button class="btn" onclick="resetAll()">✕ Reset</button>
    </div>
    <div class="stage-wrap">
      <canvas class="stage" id="stage"></canvas>
    </div>
    <div class="badge" id="badge">← Hair &nbsp;·&nbsp; Outfit →</div>
  </div>

  <div class="panel panel-right">
    <div class="panel-title">Outfits</div>
    <div class="cat-bar" id="cat-bar"></div>
    <div class="o-scroll"><div id="o-grids"></div></div>
  </div>
</div>

<script>
var IMG_BASE = document.getElementById('d-base').value;
var IMG_RED  = document.getElementById('d-red').value;

// Hair images loaded from /hair/ folder in GitHub repo
var HAIR_URLS = {
  braids: 'hair/braids.png',
  sleek:  'hair/sleek.png'
};

// Outfit images loaded from /outfits/ folder
var OUTFIT_URLS = {
  red:       'outfits/red-gown.png',
  blackgown: 'outfits/black-gown.png',
  goldgown:  'outfits/gold-gown.png',
  softfem:   'outfits/soft-fem.png',
  nightglow: 'outfits/night-glow.png'
};
// Outfits that are transparent PNGs (no black stripping needed)
var TRANSPARENT_OUTFITS = {
  blackgown: true,
  goldgown:  true,
  softfem:   true,
  nightglow: true
};

var canvas = document.getElementById('stage');
var ctx    = canvas.getContext('2d');
var DW=340, DH=510;
canvas.width=DW*2; canvas.height=DH*2;
canvas.style.width=DW+'px'; canvas.style.height=DH+'px';
ctx.scale(2,2);

var SCENES = {
  black:  null,
  closet: ['#1a0e06','#3d2010'],
  city:   ['#06060f','#1a1a3a'],
  golden: ['#1a0800','#c4842a'],
  studio: ['#060606','#2a0606']
};

var hairImgs   = {};
var outfitImgs = {};
var state = { hair:null, outfit:null, scene:'black' };

function loadImg(src, cb, errCb) {
  var img = new Image();
  img.onload  = function(){ cb(img); };
  img.onerror = function(){ if(errCb) errCb(); };
  img.src = src;
}

// Load base body
var baseImg = null;
loadImg(IMG_BASE, function(img){ baseImg=img; render(); });

// Load red dress from outfits folder
loadImg(OUTFIT_URLS.red, function(img){
  outfitImgs['red'] = {img:img, label:'Red Gown'};
  var t = document.getElementById('card-red'); if(t) t.src = OUTFIT_URLS.red;
  render();
}, function(){
  // Fallback to base64 if file not found
  loadImg(IMG_RED, function(img){
    outfitImgs['red'] = {img:img, label:'Red Gown'};
    var t = document.getElementById('card-red'); if(t) t.src = IMG_RED;
    render();
  });
});

// Load additional outfits
['blackgown','goldgown','softfem','nightglow'].forEach(function(key) {
  loadImg(OUTFIT_URLS[key], function(img) {
    var labels = {blackgown:'Black Gown',goldgown:'Gold Gown',softfem:'Soft Fem',nightglow:'Night Glow'};
    outfitImgs[key] = {img:img, label:labels[key]};
    var t = document.getElementById('card-'+key); if(t) t.src = OUTFIT_URLS[key];
    render();
  });
});

// Load hair from /hair/ folder
Object.keys(HAIR_URLS).forEach(function(key) {
  loadImg(HAIR_URLS[key], function(img) {
    hairImgs[key] = img;
    // Set thumbnail
    var icon = document.getElementById('icon-'+key);
    if (icon) {
      icon.innerHTML = '';
      var t = new Image(); t.src = HAIR_URLS[key];
      t.style.cssText = 'width:100%;height:100%;object-fit:cover;object-position:center 8%;';
      icon.appendChild(t);
    }
    var sub = document.getElementById('sub-'+key);
    if (sub) sub.textContent = 'Ready ✓';
    render();
  }, function() {
    // File not uploaded yet
    var sub = document.getElementById('sub-'+key);
    if (sub) sub.textContent = 'Upload to /hair/';
  });
});

function drawLayer(img, W, H) {
  var iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
  if (!iw||!ih) return;
  var cropW=ih*(W/H), cropX=(iw-cropW)/2;
  ctx.drawImage(img, cropX,0,cropW,ih, 0,0,W,H);
}

var stripCache = {};
function stripAndDraw(img, W, H) {
  var iw=img.naturalWidth, ih=img.naturalHeight; if(!iw||!ih) return;
  var k=iw+'x'+ih;
  if (!stripCache[k]) {
    var off=document.createElement('canvas'); off.width=iw; off.height=ih;
    var c2=off.getContext('2d'); c2.drawImage(img,0,0);
    var d=c2.getImageData(0,0,iw,ih),px=d.data;
    for (var n=0;n<px.length;n+=4) { if(px[n]<40&&px[n+1]<40&&px[n+2]<40) px[n+3]=0; }
    c2.putImageData(d,0,0); stripCache[k]=off;
  }
  var cropW=ih*(W/H), cropX=(stripCache[k].width-cropW)/2;
  ctx.drawImage(stripCache[k], cropX,0,cropW,ih, 0,0,W,H);
}

function render() {
  var W=DW, H=DH; ctx.clearRect(0,0,W,H);
  var sc=SCENES[state.scene];
  if (sc) { var g=ctx.createLinearGradient(0,0,W,H); g.addColorStop(0,sc[0]); g.addColorStop(1,sc[1]); ctx.fillStyle=g; }
  else { ctx.fillStyle='#000'; }
  ctx.fillRect(0,0,W,H);
  if (baseImg) drawLayer(baseImg,W,H);
  if (state.outfit&&outfitImgs[state.outfit]) { if(TRANSPARENT_OUTFITS[state.outfit]) drawLayer(outfitImgs[state.outfit].img,W,H); else stripAndDraw(outfitImgs[state.outfit].img,W,H); }
  if (state.hair&&hairImgs[state.hair]) drawLayer(hairImgs[state.hair],W,H);
}

document.querySelectorAll('[data-key]').forEach(function(slot){
  slot.addEventListener('click', function(){
    var key=slot.dataset.key;
    if (key!=='none'&&!hairImgs[key]) return;
    document.querySelectorAll('[data-key]').forEach(function(s){s.classList.remove('on');});
    slot.classList.add('on');
    state.hair = key==='none'?null:key;
    render(); updateBadge();
  });
});

document.querySelectorAll('.scene-item').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.scene-item').forEach(function(b){b.classList.remove('on');});
    btn.classList.add('on'); state.scene=btn.dataset.scene; render();
  });
});

var CATS=[
  {k:'editorial',lbl:'Editorial',items:[{key:'red',label:'Red Gown'},{key:'blackgown',label:'Black Gown'},{key:'goldgown',label:'Gold Gown'}]},
  {k:'thatgirl', lbl:'That Girl',items:[{key:'softfem',label:'Soft Fem'}]},
  {k:'boss',     lbl:'Boss',     items:[]},
  {k:'city',     lbl:'City Girl',items:[{key:'nightglow',label:'Night Glow'}]},
];
var catBar=document.getElementById('cat-bar');
var oGrids=document.getElementById('o-grids');
CATS.forEach(function(cat,ci){
  var tab=document.createElement('button');
  tab.className='cat-btn'+(ci===0?' on':'');
  tab.textContent=cat.lbl;
  tab.addEventListener('click',function(){
    document.querySelectorAll('.cat-btn').forEach(function(t){t.classList.remove('on');});
    tab.classList.add('on');
    document.querySelectorAll('.o-grid').forEach(function(g){g.classList.add('off');});
    document.getElementById('g-'+cat.k).classList.remove('off');
  });
  catBar.appendChild(tab);
  var grid=document.createElement('div');
  grid.className='o-grid'+(ci===0?'':' off');
  grid.id='g-'+cat.k;
  var nc=document.createElement('div');
  nc.className='none-o on'; nc.id='n-'+cat.k;
  nc.innerHTML='<span style="font-size:1rem">✕</span><span>None</span>';
  nc.addEventListener('click',function(){clearOutfits();state.outfit=null;render();updateBadge();});
  grid.appendChild(nc);
  cat.items.forEach(function(o){
    var card=document.createElement('div');
    card.className='o-card'; card.dataset.key=o.key;
    var img=document.createElement('img'); img.id='card-'+o.key; img.alt=o.label;
    card.appendChild(img);
    card.innerHTML+='<div class="o-tick">✓</div><div class="o-lbl">'+o.label+'</div>';
    card.addEventListener('click',function(){
      clearOutfits(); card.classList.add('on');
      document.getElementById('n-'+cat.k).classList.remove('on');
      state.outfit=o.key; render(); updateBadge();
    });
    grid.appendChild(card);
  });
  if(cat.items.length===0){
    var ph=document.createElement('div'); ph.className='coming-soon'; ph.textContent='Coming soon';
    grid.appendChild(ph);
  }
  oGrids.appendChild(grid);
});

function clearOutfits(){
  document.querySelectorAll('.o-card').forEach(function(c){c.classList.remove('on');});
  document.querySelectorAll('.none-o').forEach(function(c){c.classList.add('on');});
}
function updateBadge(){
  var h=state.hair, o=state.outfit&&outfitImgs[state.outfit]?outfitImgs[state.outfit].label:null;
  var parts=[]; if(h)parts.push(h); if(o)parts.push(o);
  document.getElementById('badge').textContent=parts.length?'✦ '+parts.join(' · '):'← Hair · Outfit →';
}
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent='✦ '+msg; t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2500);
}
function resetAll(){
  state={hair:null,outfit:null,scene:'black'};
  document.querySelectorAll('[data-key]').forEach(function(s){s.classList.remove('on');});
  document.getElementById('slot-none').classList.add('on');
  document.querySelectorAll('.scene-item').forEach(function(b){b.classList.remove('on');});
  document.querySelector('[data-scene="black"]').classList.add('on');
  clearOutfits(); updateBadge(); render();
}
</script>
</body>
</html>
