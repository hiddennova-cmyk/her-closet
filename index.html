<style>
:root {
  --ink:#0E0C09; --ivory:#F7F2EA; --ivory-dim:#EDE6D8; --linen:#D9CFBD;
  --gold:#C9A84C; --gold-lt:#E8CB7A; --gold-dim:#8B6530;
  --wood-dk:#1A0E06; --wood-md:#2C1A0A; --wood-lt:#3D2410;
  --terra:#C4742A; --terra-lt:#E8956A; --terra-dk:#7A3A0A;
  --kente-r:#C84B11; --kente-b:#1A3A8F; --kente-g:#2D7A1F;
  --rule:rgba(14,12,9,0.1);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100vh;overflow:hidden;background:var(--terra-dk);font-family:'DM Sans',sans-serif;}

/* ── LANDING ── */
#landing {
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center, #3d1a06 0%, #1a0800 60%, #0d0400 100%);
  z-index:200;
  transition:opacity 0.8s ease 1.4s;
}
#landing.gone{opacity:0;pointer-events:none;}

.landing-title {
  font-family:'Playfair Display',serif;
  font-size:clamp(1.1rem,3.5vw,1.8rem);
  font-style:italic;
  font-weight:400;
  color:var(--gold-lt);
  letter-spacing:0.06em;
  margin-bottom:24px;
  text-align:center;
  opacity:0.92;
}

/* ── ARMOIRE WRAP ── */
.armoire-wrap {
  position:relative;
  width:min(380px,88vw);
  cursor:pointer;
  filter:drop-shadow(0 40px 80px rgba(0,0,0,0.8));
}

/* CORNICE */
.cornice {
  width:106%;margin-left:-3%;height:18px;
  background:var(--wood-lt);
  border:1.5px solid var(--gold);
  border-radius:2px 2px 0 0;
  position:relative;
  display:flex;align-items:center;justify-content:center;
}
.cornice-text {
  font-family:'Playfair Display',serif;
  font-style:italic;font-size:0.65rem;
  letter-spacing:0.25em;color:var(--gold-lt);
  opacity:0.7;
}

/* ARMOIRE BODY */
.armoire-body {
  position:relative;
  background:var(--wood-md);
  border:2px solid var(--gold);
  border-top:none;
  overflow:hidden;
  aspect-ratio:0.72;
}
.armoire-body::before {
  content:'';position:absolute;inset:4px;
  border:0.5px solid rgba(201,168,76,0.25);
  pointer-events:none;z-index:50;
}

/* BEHIND THE DOORS */
.armoire-behind {
  position:absolute;inset:0;
  background:linear-gradient(170deg, var(--terra-lt) 0%, var(--terra) 40%, var(--terra-dk) 100%);
  display:flex;align-items:center;justify-content:center;
  z-index:1;
}
.behind-canvas { z-index:2; }

/* DOOR PANELS */
.door-left, .door-right {
  position:absolute;
  top:0;width:50%;height:100%;
  z-index:10;
  transition:transform 1.2s cubic-bezier(0.77,0,0.18,1);
  overflow:hidden;
  background:var(--wood-md);
}
.door-left  {left:0; transform-origin:left center; border-right:1px solid rgba(201,168,76,0.3);}
.door-right {right:0;transform-origin:right center;border-left:1px solid rgba(201,168,76,0.3);}
.armoire-wrap.open .door-left  {transform:translateX(-100%);}
.armoire-wrap.open .door-right {transform:translateX(100%);}
.door-left svg, .door-right svg {width:100%;height:100%;display:block;}

/* HANDLES */
.handle {
  position:absolute;top:50%;
  transform:translateY(-50%);
  z-index:20;width:10px;height:32px;
  background:linear-gradient(180deg,var(--gold-lt),var(--gold),var(--gold-dim));
  border-radius:5px;
  box-shadow:0 2px 8px rgba(0,0,0,0.5);
  transition:opacity 0.4s;
}
.handle-left  {right:6px;}
.handle-right {left:6px;}
.handle::before,.handle::after {
  content:'';position:absolute;left:50%;transform:translateX(-50%);
  width:14px;height:14px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,var(--gold-lt),var(--gold-dim));
  box-shadow:0 1px 4px rgba(0,0,0,0.4);
}
.handle::before{top:-8px;}
.handle::after{bottom:-8px;}
.armoire-wrap.open .handle{opacity:0;}

/* FEET */
.armoire-feet {
  display:flex;justify-content:space-between;
  padding:0 8%;
}
.foot {
  width:14%;height:14px;
  background:var(--wood-lt);
  border:1px solid var(--gold);
  border-top:none;border-radius:0 0 3px 3px;
}

/* HINT */
.open-pill {
  margin-top:22px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  animation:pillpulse 2s ease-in-out infinite;
}
.open-pill-text {
  font-family:'Playfair Display',serif;
  font-style:italic;
  font-size:clamp(0.85rem,2.5vw,1.1rem);
  letter-spacing:0.12em;
  color:var(--gold-lt);
  background:rgba(201,168,76,0.08);
  border:1.5px solid rgba(201,168,76,0.35);
  border-radius:50px;
  padding:10px 28px;
  display:block;
  transition:all 0.2s;
}
.open-pill:hover .open-pill-text {
  background:rgba(201,168,76,0.15);
  border-color:rgba(201,168,76,0.7);
}
@keyframes pillpulse {
  0%,100%{ opacity:0.5; transform:scale(1); }
  50%{ opacity:1; transform:scale(1.04); }
}
.armoire-wrap.open ~ .open-pill{opacity:0;pointer-events:none;transition:opacity 0.4s;}

/* ── GAME ── */
#game {
  position:fixed;inset:0;
  display:grid;
  grid-template-rows:48px 1fr;
  grid-template-columns:200px 1fr 220px;
  opacity:0;pointer-events:none;
  transition:opacity 0.7s ease;
  background:var(--ivory);
}
#game.visible{opacity:1;pointer-events:all;}

/* MASTHEAD */
.mast {
  grid-column:1/-1;
  background:var(--ivory);border-bottom:1.5px solid var(--ink);
  display:flex;align-items:center;justify-content:space-between;padding:0 24px;
  position:relative;overflow:hidden;
}
.mast::after {
  content:'';position:absolute;bottom:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--kente-r) 0%,var(--kente-r) 33%,var(--gold) 33%,var(--gold) 66%,var(--kente-b) 66%,var(--kente-b) 100%);
}
.mast-logo{font-family:'Playfair Display',serif;font-size:1.05rem;font-style:italic;color:var(--ink);}
.mast-logo b{color:var(--gold-dim);font-weight:400;}
.mast-logo span{font-family:'DM Sans',sans-serif;font-style:normal;font-size:0.38rem;letter-spacing:0.32em;text-transform:uppercase;color:var(--linen);display:block;margin-top:-1px;}
.mast-right{display:flex;align-items:center;gap:16px;}
.mast-tag{font-size:0.44rem;letter-spacing:0.22em;color:var(--linen);text-transform:uppercase;}
.reset-btn{font-size:0.42rem;letter-spacing:0.18em;text-transform:uppercase;background:none;border:1px solid var(--linen);color:var(--linen);padding:4px 12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.2s;}
.reset-btn:hover{border-color:var(--ink);color:var(--ink);}

/* PANELS */
.panel{background:var(--ivory);display:flex;flex-direction:column;overflow:hidden;}
.panel-left{border-right:1.5px solid var(--ink);}
.panel-right{border-left:1.5px solid var(--ink);}
.panel-head{padding:16px 14px 12px;border-bottom:1px solid var(--rule);flex-shrink:0;}
.ph-label{font-size:0.38rem;letter-spacing:0.32em;text-transform:uppercase;color:var(--linen);margin-bottom:2px;}
.ph-title{font-family:'Playfair Display',serif;font-size:1.05rem;font-style:italic;color:var(--ink);}

/* PILLS */
.pill-row{display:flex;flex-wrap:wrap;gap:4px;padding:8px 10px;border-bottom:1px solid var(--rule);flex-shrink:0;background:var(--ivory-dim);}
.pill{font-size:0.38rem;letter-spacing:0.1em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--linen);color:var(--linen);background:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s;}
.pill:hover{border-color:var(--gold-dim);color:var(--gold-dim);}
.pill.on{background:var(--ink);border-color:var(--ink);color:var(--ivory);}
.pill-section{display:none!important;flex-direction:column;gap:2px;}
.pill-section.on{display:flex!important;}

.panel-scroll{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:2px;}
.panel-scroll::-webkit-scrollbar{width:2px;}
.panel-scroll::-webkit-scrollbar-thumb{background:var(--linen);}

/* SLOTS */
.slot{display:flex;align-items:center;gap:9px;padding:8px 9px;border:1px solid transparent;border-bottom:1px solid var(--rule);cursor:pointer;width:100%;font-family:'DM Sans',sans-serif;text-align:left;background:none;transition:all 0.15s;}
.slot:hover{background:var(--ivory-dim);}
.slot.on{background:var(--ivory-dim);border-left:3px solid var(--gold);}
.slot.locked{opacity:0.28;cursor:default;pointer-events:none;}
.slot-icon{width:28px;height:28px;border-radius:50%;overflow:hidden;flex-shrink:0;border:1px solid var(--linen);display:flex;align-items:center;justify-content:center;background:var(--ivory-dim);font-size:0.65rem;}
.slot.on .slot-icon{border-color:var(--gold);}
.slot-icon img{width:100%;height:100%;object-fit:cover;object-position:center 8%;}
.slot-info{flex:1;}
.slot-name{font-family:'Libre Baskerville',serif;font-size:0.75rem;font-style:italic;color:var(--ink);}
.slot.on .slot-name{color:var(--gold-dim);}
.slot-sub{font-size:0.36rem;letter-spacing:0.08em;color:var(--linen);margin-top:1px;}
.slot-mark{width:5px;height:5px;border-radius:50%;border:1px solid var(--linen);flex-shrink:0;}
.slot.on .slot-mark{background:var(--gold);border-color:var(--gold);}

/* SCENE */
.scene-foot{border-top:1.5px solid var(--ink);padding:10px 12px;flex-shrink:0;background:var(--ivory-dim);}
.scene-foot-lbl{font-size:0.36rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:5px;}
.scene-row{display:flex;flex-direction:column;gap:2px;}
.scene-btn{display:flex;align-items:center;gap:8px;padding:5px 7px;cursor:pointer;border:1px solid transparent;background:none;width:100%;font-family:'DM Sans',sans-serif;transition:all 0.15s;}
.scene-btn:hover{background:var(--ivory);}
.scene-btn.on{border-left:2px solid var(--gold);background:rgba(201,168,76,0.1);}
.scene-sw{width:18px;height:18px;border-radius:2px;flex-shrink:0;}
.scene-lbl{font-family:'Libre Baskerville',serif;font-size:0.68rem;font-style:italic;color:var(--ink);flex:1;text-align:left;}
.scene-btn.on .scene-lbl{color:var(--gold-dim);}
.scene-dot{width:5px;height:5px;border-radius:50%;border:1px solid var(--linen);flex-shrink:0;}
.scene-btn.on .scene-dot{background:var(--gold);border-color:var(--gold);}

/* CENTER */
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--ivory);position:relative;overflow:hidden;}
.stage-col{display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;z-index:1;}
.stage-wrap{position:relative;}
.stage-canvas{display:block;box-shadow:0 32px 80px rgba(14,12,9,0.16),0 2px 0 var(--gold);}
.stage-tag{position:absolute;top:-1px;right:-1px;background:var(--ink);color:var(--gold);font-size:0.34rem;letter-spacing:0.2em;text-transform:uppercase;padding:4px 8px;font-family:'DM Sans',sans-serif;}
.look-strip{width:380px;display:flex;align-items:baseline;justify-content:space-between;padding:10px 0 6px;border-top:1px solid var(--rule);}
.look-name{font-family:'Playfair Display',serif;font-style:italic;font-size:0.85rem;color:var(--ink);}
.look-sub{font-size:0.36rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--linen);}

/* OUTFIT PANEL */
.cat-tabs{display:flex;border-bottom:1.5px solid var(--ink);flex-shrink:0;}
.cat-tab{flex:1;padding:12px 2px;font-size:0.38rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--linen);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s;}
.cat-tab:hover{color:var(--gold-dim);}
.cat-tab.on{color:var(--ink);border-bottom-color:var(--ink);background:var(--ivory-dim);}
.o-scroll{flex:1;overflow-y:auto;padding:8px;}
.o-scroll::-webkit-scrollbar{width:2px;}
.o-scroll::-webkit-scrollbar-thumb{background:var(--linen);}
.o-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.o-grid.off{display:none;}
.o-card{cursor:pointer;border:1.5px solid var(--rule);overflow:hidden;background:var(--ivory-dim);transition:all 0.16s;position:relative;}
.o-card:hover{border-color:var(--gold-dim);transform:translateY(-2px);box-shadow:2px 2px 0 var(--gold-dim);}
.o-card.on{border-color:var(--ink);box-shadow:3px 3px 0 var(--ink);}
.o-card.locked{opacity:0.3;cursor:default;pointer-events:none;}
.o-card img{width:100%;aspect-ratio:2/3;object-fit:cover;object-position:center 8%;display:block;}
.o-card-foot{padding:5px 6px;background:var(--ivory);border-top:1px solid var(--rule);}
.o-card-name{font-family:'Libre Baskerville',serif;font-size:0.58rem;font-style:italic;color:var(--ink);}
.o-card.on .o-card-name{color:var(--gold-dim);}
.o-card-tag{font-size:0.32rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--linen);margin-top:1px;}
.o-tick{position:absolute;top:5px;left:5px;width:14px;height:14px;background:var(--ink);display:none;align-items:center;justify-content:center;font-size:0.5rem;color:var(--gold);}
.o-card.on .o-tick{display:flex;}
.none-card{cursor:pointer;border:1.5px dashed var(--rule);aspect-ratio:2/3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--linen);font-size:0.4rem;letter-spacing:0.1em;text-transform:uppercase;transition:all 0.16s;background:none;font-family:'DM Sans',sans-serif;}
.none-card:hover{border-color:var(--gold-dim);color:var(--gold-dim);}
.none-card.on{border-color:var(--ink);border-style:solid;color:var(--ink);background:var(--ivory-dim);}
.coming-card{border:1px dashed var(--rule);aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;font-size:0.34rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--linen);}

      <div class="pill-section" id="pill-updo">
        <button class="slot locked" data-key="headwrap"><div class="slot-icon">🎁</div><div class="slot-info"><div class="slot-name">Kente Headwrap</div></div><div class="slot-mark"></div></button>
        <button class="slot locked" data-key="highpony"><div class="slot-icon">🎀</div><div class="slot-info"><div class="slot-name">High Ponytail</div></div><div class="slot-mark"></div></button>
        <button class="slot locked" data-key="bantu"><div class="slot-icon">🔵</div><div class="slot-info"><div class="slot-name">Bantu Knots</div></div><div class="slot-mark"></div></button>
      </div>
      <div class="pill-section" id="pill-braids">
        <button class="slot locked" data-key="braids-long"><div class="slot-icon">💫</div><div class="slot-info"><div class="slot-name">Long Braids</div></div><div class="slot-mark"></div></button>
        <button class="slot locked" data-key="cornrows"><div class="slot-icon">〰️</div><div class="slot-info"><div class="slot-name">Cornrows</div></div><div class="slot-mark"></div></button>
      </div>
    </div>
    <div class="scene-foot">
      <div class="scene-foot-lbl">World</div>
      <div class="scene-row">
        <button class="scene-btn on" data-scene="terra"><div class="scene-sw" style="background:linear-gradient(135deg,#E8956A,#7A3A0A);"></div><div class="scene-lbl">Terracotta</div><div class="scene-dot"></div></button>
        <button class="scene-btn" data-scene="ivory"><div class="scene-sw" style="background:linear-gradient(135deg,#F7F2EA,#D9CFBD);border:1px solid #ccc;"></div><div class="scene-lbl">Studio</div><div class="scene-dot"></div></button>
        <button class="scene-btn" data-scene="forest"><div class="scene-sw" style="background:linear-gradient(135deg,#0a1a06,#2d5a1a);"></div><div class="scene-lbl">Sacred Forest</div><div class="scene-dot"></div></button>
        <button class="scene-btn" data-scene="palace"><div class="scene-sw" style="background:linear-gradient(135deg,#1a0d00,#8B6530);"></div><div class="scene-lbl">The Palace</div><div class="scene-dot"></div></button>
        <button class="scene-btn" data-scene="cosmic"><div class="scene-sw" style="background:linear-gradient(135deg,#04020f,#1a0a3a);"></div><div class="scene-lbl">Cosmic</div><div class="scene-dot"></div></button>
      </div>
    </div>
  </div>

  <!-- CENTER -->
  <div class="center">
    <div class="stage-col">
      <div class="stage-wrap">
        <div class="stage-tag">Adoma</div>
        <canvas class="stage-canvas" id="stage"></canvas>
      </div>
      <div class="look-strip">
        <div class="look-name" id="look-name"><em>She stands, waiting</em></div>
        <div class="look-sub" id="look-sub">Choose her look →</div>
      </div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="panel panel-right">
    <div class="panel-head"><div class="ph-label">She wears</div><div class="ph-title">Outfits</div></div>
    <div class="cat-tabs" id="cat-bar"></div>
    <div class="o-scroll"><div id="o-grids"></div></div>
  </div>
</div>

<script>
// ── DOOR OPEN ──
function openArmoire() {
  var wrap = document.getElementById('armoireWrap');
  if (wrap.classList.contains('open')) return;
  wrap.classList.add('open');
  setTimeout(function() {
    document.getElementById('landing').classList.add('gone');
    document.getElementById('game').classList.add('visible');
  }, 1200);
}

// ── CANVAS ENGINE ──
var IMG_BASE = document.getElementById('d-base').value;
var OUTFIT_EMBEDS = { 'kente-gown': document.getElementById('d-kente-gown').value };

var HAIR_URLS = {
  'twa':'hair/twa.png','braids-long':'hair/braids-long.png',
  'headwrap':'hair/headwrap.png','bantu':'hair/bantu.png',
  'locs':'hair/locs.png','highpony':'hair/highpony.png','cornrows':'hair/cornrows.png',
};
var OUTFIT_URLS = {
  'kente-gown':'outfits/kente-gown.png','kente-romper':'outfits/kente-romper.png',
  'kaba-slit':'outfits/kaba-slit.png','smock':'outfits/smock.png',
  'cosmic-kente':'outfits/cosmic-kente.png',
};
var OUTFIT_META = {
  'kente-gown':  {name:'Kente Gown',   tag:'Ancestral · Formal'},
  'kente-romper':{name:'Kente Romper', tag:'Modern · Bold'},
  'kaba-slit':   {name:'Kaba & Slit',  tag:'Traditional · Elegant'},
  'smock':       {name:'Smock Dress',  tag:'Heritage · Northern'},
  'cosmic-kente':{name:'Cosmic Kente', tag:'Afrofuturist'},
};
var SCENES = {
  terra: ['#E8956A','#7A3A0A'],
  ivory: ['#F7F2EA','#D9CFBD'],
  forest:['#0a1a06','#2d5a1a'],
  palace:['#1a0d00','#8B6530'],
  cosmic:['#04020f','#1a0a3a'],
};

// Behind-door mini canvas
var bc = document.getElementById('behind-stage');
var bctx = bc.getContext('2d');
var bw = 120, bh = 180;
bc.width = bw*2; bc.height = bh*2;
bc.style.width = bw+'px'; bc.style.height = bh+'px';
bctx.scale(2,2);

// Main stage canvas
var canvas = document.getElementById('stage');
var ctx = canvas.getContext('2d');
var DW=380, DH=570;
canvas.width=DW*2; canvas.height=DH*2;
canvas.style.width=DW+'px'; canvas.style.height=DH+'px';
ctx.scale(2,2);

var hairImgs={}, outfitImgs={}, stripCache={}, transparencyCache={};
var state={hair:null,outfit:null,scene:'terra'};
var baseImg=null;

function loadImg(src,cb,errCb){var img=new Image();img.onload=function(){cb(img);};img.onerror=function(){if(errCb)errCb();};img.src=src;}

function drawLayer(img,W,H,c){var iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;if(!iw||!ih)return;var cropW=ih*(W/H),cropX=(iw-cropW)/2;(c||ctx).drawImage(img,cropX,0,cropW,ih,0,0,W,H);}

function stripAndDraw(img,W,H){var iw=img.naturalWidth,ih=img.naturalHeight;if(!iw||!ih)return;var k=iw+'x'+ih+img.src.slice(-12);if(!stripCache[k]){var off=document.createElement('canvas');off.width=iw;off.height=ih;var c2=off.getContext('2d');c2.drawImage(img,0,0);var d=c2.getImageData(0,0,iw,ih),px=d.data;for(var n=0;n<px.length;n+=4){if(px[n]<40&&px[n+1]<40&&px[n+2]<40)px[n+3]=0;}c2.putImageData(d,0,0);stripCache[k]=off;}var cropW=ih*(W/H),cropX=(stripCache[k].width-cropW)/2;ctx.drawImage(stripCache[k],cropX,0,cropW,ih,0,0,W,H);}

function hasTransparency(key,cat){var ck=cat+'_'+key;if(transparencyCache[ck]!==undefined)return transparencyCache[ck];var img=cat==='outfit'?outfitImgs[key]:hairImgs[key];if(!img)return false;var iw=img.naturalWidth,ih=img.naturalHeight;if(!iw||!ih)return false;var off=document.createElement('canvas');off.width=iw;off.height=ih;var c2=off.getContext('2d');c2.drawImage(img,0,0);var hasA=[[0,0],[iw-1,0],[0,ih-1],[iw-1,ih-1],[Math.floor(iw/2),0],[0,Math.floor(ih/2)]].some(function(s){return c2.getImageData(s[0],s[1],1,1).data[3]<255;});transparencyCache[ck]=hasA;return hasA;}

function renderBehind() {
  var sc=SCENES[state.scene];
  var g=bctx.createLinearGradient(0,0,bw,bh);
  g.addColorStop(0,sc[0]);g.addColorStop(1,sc[1]);
  bctx.fillStyle=g;bctx.fillRect(0,0,bw,bh);
  if(baseImg)drawLayer(baseImg,bw,bh,bctx);
}

function render(){
  var W=DW,H=DH;ctx.clearRect(0,0,W,H);
  var sc=SCENES[state.scene];
  var g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,sc[0]);g.addColorStop(1,sc[1]);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(baseImg)drawLayer(baseImg,W,H);
  if(state.outfit&&outfitImgs[state.outfit]){if(hasTransparency(state.outfit,'outfit'))drawLayer(outfitImgs[state.outfit],W,H);else stripAndDraw(outfitImgs[state.outfit],W,H);}
  if(state.hair&&hairImgs[state.hair]){if(hasTransparency(state.hair,'hair'))drawLayer(hairImgs[state.hair],W,H);else stripAndDraw(hairImgs[state.hair],W,H);}
  renderBehind();
}

// Load base from file path first — fallback to embedded base64
var BASE_PATH = 'base.png';
loadImg(BASE_PATH, function(img) {
  baseImg = img; render();
}, function() {
  // fallback to embedded
  if (IMG_BASE) {
    loadImg(IMG_BASE, function(img) { baseImg = img; render(); });
  }
});

function loadOutfit(key){loadImg(OUTFIT_URLS[key],function(img){outfitImgs[key]=img;var t=document.getElementById('card-img-'+key);if(t)t.src=OUTFIT_URLS[key];var card=document.querySelector('.o-card[data-key="'+key+'"]');if(card)card.classList.remove('locked');render();},function(){if(OUTFIT_EMBEDS[key]){loadImg(OUTFIT_EMBEDS[key],function(img){outfitImgs[key]=img;var t=document.getElementById('card-img-'+key);if(t)t.src=OUTFIT_EMBEDS[key];var card=document.querySelector('.o-card[data-key="'+key+'"]');if(card)card.classList.remove('locked');render();});}});}
Object.keys(OUTFIT_URLS).forEach(loadOutfit);

function loadHair(key){loadImg(HAIR_URLS[key],function(img){hairImgs[key]=img;var icon=document.getElementById('icon-'+key);if(icon){icon.innerHTML='';var t=new Image();t.src=HAIR_URLS[key];t.style.cssText='width:100%;height:100%;object-fit:cover;object-position:center 8%;';icon.appendChild(t);}var sub=document.getElementById('sub-'+key);if(sub)sub.textContent='✓ Ready';document.querySelectorAll('.slot[data-key="'+key+'"]').forEach(function(s){s.classList.remove('locked');});render();});}
Object.keys(HAIR_URLS).forEach(loadHair);

document.querySelectorAll('[data-key]').forEach(function(slot){slot.addEventListener('click',function(){var key=slot.dataset.key;if(key!=='none'&&!hairImgs[key])return;document.querySelectorAll('[data-key]').forEach(function(s){s.classList.remove('on');});document.querySelectorAll('[data-key="'+key+'"]').forEach(function(s){s.classList.add('on');});state.hair=(key==='none')?null:key;render();updateLook();});});

document.querySelectorAll('.scene-btn').forEach(function(btn){btn.addEventListener('click',function(){document.querySelectorAll('.scene-btn').forEach(function(b){b.classList.remove('on');});btn.classList.add('on');state.scene=btn.dataset.scene;render();});});

var CATS=[
  {k:'kente',lbl:'Kente',items:['kente-gown','kente-romper']},
  {k:'traditional',lbl:'Traditional',items:['kaba-slit','smock']},
  {k:'cosmic',lbl:'Cosmic',items:['cosmic-kente']},
];
var catBar=document.getElementById('cat-bar'),oGrids=document.getElementById('o-grids');
CATS.forEach(function(cat,ci){
  var tab=document.createElement('button');tab.className='cat-tab'+(ci===0?' on':'');tab.textContent=cat.lbl;
  tab.addEventListener('click',function(){document.querySelectorAll('.cat-tab').forEach(function(t){t.classList.remove('on');});tab.classList.add('on');document.querySelectorAll('.o-grid').forEach(function(g){g.classList.add('off');});document.getElementById('g-'+cat.k).classList.remove('off');});
  catBar.appendChild(tab);
  var grid=document.createElement('div');grid.className='o-grid'+(ci===0?'':' off');grid.id='g-'+cat.k;
  var nc=document.createElement('div');nc.className='none-card on';nc.id='n-'+cat.k;nc.innerHTML='<span style="font-size:1.1rem;opacity:0.3">—</span><span>None</span>';nc.addEventListener('click',function(){clearOutfits();state.outfit=null;render();updateLook();});grid.appendChild(nc);
  cat.items.forEach(function(key){
    var meta=OUTFIT_META[key]||{name:key,tag:''};
    var card=document.createElement('div');card.className='o-card locked';card.dataset.key=key;
    var img=document.createElement('img');img.id='card-img-'+key;img.alt=meta.name;card.appendChild(img);
    var tick=document.createElement('div');tick.className='o-tick';tick.textContent='✓';card.appendChild(tick);
    var foot=document.createElement('div');foot.className='o-card-foot';foot.innerHTML='<div class="o-card-name">'+meta.name+'</div><div class="o-card-tag">'+meta.tag+'</div>';card.appendChild(foot);
    card.addEventListener('click',function(){if(card.classList.contains('locked'))return;clearOutfits();card.classList.add('on');document.getElementById('n-'+cat.k).classList.remove('on');state.outfit=key;render();updateLook();});
    grid.appendChild(card);
  });
  if(cat.items.length===0){var ph=document.createElement('div');ph.className='coming-card';ph.textContent='Coming soon';grid.appendChild(ph);}
  oGrids.appendChild(grid);
});

function clearOutfits(){document.querySelectorAll('.o-card').forEach(function(c){c.classList.remove('on');});document.querySelectorAll('.none-card').forEach(function(c){c.classList.add('on');});}
function updateLook(){var parts=[],subs=[];if(state.outfit&&OUTFIT_META[state.outfit]){parts.push(OUTFIT_META[state.outfit].name);subs.push(OUTFIT_META[state.outfit].tag);}if(state.hair)parts.push(state.hair.replace(/-/g,' '));document.getElementById('look-name').innerHTML=parts.length?'<em>'+parts.join(' · ')+'</em>':'<em>She stands, waiting</em>';document.getElementById('look-sub').textContent=parts.length?subs.join(' · '):'Choose her look →';}
function resetAll(){state={hair:null,outfit:null,scene:'terra'};document.querySelectorAll('[data-key]').forEach(function(s){s.classList.remove('on');});document.getElementById('slot-none').classList.add('on');document.querySelectorAll('.scene-btn').forEach(function(b){b.classList.remove('on');});document.querySelector('[data-scene="terra"]').classList.add('on');clearOutfits();updateLook();render();}
function switchPill(btn,cat){document.querySelectorAll('.pill').forEach(function(p){p.classList.remove('on');});btn.classList.add('on');document.querySelectorAll('.pill-section').forEach(function(s){s.classList.remove('on');s.style.display='none';});var sec=document.getElementById('pill-'+cat);sec.classList.add('on');sec.style.display='flex';}
</script>
</body>
</html>
